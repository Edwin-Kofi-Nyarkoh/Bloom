<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloom is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fff8f4;
        color: #2b1a3f;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
        max-width: 18rem;
        color: #75657f;
      }
      button {
        margin-top: 12px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #db3d74;
        color: #fff;
        font-size: 1rem;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.svg" alt="" />
    <h1>You're offline</h1>
    <p>Bloom needs a connection to load your cycle. Check your internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
